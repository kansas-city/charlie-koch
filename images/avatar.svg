<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Portrait illustration of Charlie Koch">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf2ff"/>
      <stop offset="1" stop-color="#d7e7ff"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="98" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#2563eb" stroke-width="4" stroke-dasharray="10 7" opacity="0.5"/>
  <!-- shoulders / suit -->
  <path d="M40 190 c0-38 27-62 60-62 s60 24 60 62 z" fill="#16324f"/>
  <path d="M86 132 l14 20 14-20" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M92 144 l8 12 8-12" fill="#ffffff"/>
  <!-- head -->
  <circle cx="100" cy="92" r="44" fill="#f5c9a6"/>
  <!-- hair -->
  <path d="M58 86 a42 42 0 0 1 84 0 c-6-10-14-16-24-18 c-10 8-30 8-38 4 c-10 2-16 6-22 14 z" fill="#5b4636"/>
  <!-- eyes -->
  <circle cx="85" cy="92" r="4.5" fill="#16324f"/>
  <circle cx="115" cy="92" r="4.5" fill="#16324f"/>
  <!-- smile -->
  <path d="M86 110 q14 12 28 0" stroke="#b3755a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- eyebrows -->
  <path d="M78 82 q7-5 14-1" stroke="#5b4636" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M108 81 q7-4 14 1" stroke="#5b4636" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
