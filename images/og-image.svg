<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="CharlieKoch blog - Kansas City business insights by Charlie Koch, President of Bank Midwest">
  <defs>
    <linearGradient id="ogbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16324f"/>
      <stop offset="0.6" stop-color="#1f4a73"/>
      <stop offset="1" stop-color="#0e8f8b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#ogbg)"/>
  <circle cx="1080" cy="80" r="180" fill="#f59e0b" opacity="0.16"/>
  <circle cx="120" cy="600" r="150" fill="#2563eb" opacity="0.2"/>

  <g transform="translate(90,110)">
    <rect width="92" height="92" rx="24" fill="#2563eb" stroke="#f59e0b" stroke-width="3"/>
    <text x="46" y="50" font-family="Nunito, Segoe UI, sans-serif" font-size="38" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central">CK</text>
    <text x="118" y="38" font-family="Nunito, Segoe UI, sans-serif" font-size="44" font-weight="800" fill="#ffffff">Charlie<tspan fill="#f59e0b">Koch</tspan></text>
    <text x="118" y="76" font-family="Nunito, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#9fc3ee">President of Bank Midwest</text>
  </g>

  <text x="90" y="380" font-family="Nunito, Segoe UI, sans-serif" font-size="76" font-weight="800" fill="#ffffff">Kansas City</text>
  <text x="90" y="470" font-family="Nunito, Segoe UI, sans-serif" font-size="76" font-weight="800" fill="#f59e0b">Business Insights</text>
  <text x="90" y="540" font-family="Nunito, Segoe UI, sans-serif" font-size="30" font-weight="600" fill="#cfe1f5">Community banking, local growth, and the people building KC's economy.</text>
</svg>
