<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Friendly Kansas City skyline illustration">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7e7ff"/>
      <stop offset="1" stop-color="#f7f9fc"/>
    </linearGradient>
    <linearGradient id="bld" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#16324f"/>
    </linearGradient>
    <linearGradient id="bld2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e8f8b"/>
      <stop offset="1" stop-color="#0b5f5d"/>
    </linearGradient>
    <linearGradient id="bld3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <circle cx="510" cy="90" r="52" fill="#fde8c8"/>
  <circle cx="510" cy="90" r="38" fill="#f59e0b" opacity="0.9"/>

  <g fill="#ffffff" opacity="0.9">
    <circle cx="90" cy="70" r="5"/>
    <circle cx="150" cy="120" r="4"/>
    <circle cx="220" cy="60" r="5"/>
    <circle cx="330" cy="100" r="4"/>
    <circle cx="420" cy="55" r="5"/>
    <circle cx="580" cy="170" r="4"/>
  </g>

  <!-- ground -->
  <rect x="0" y="400" width="640" height="80" fill="#e2e8f0"/>
  <rect x="0" y="400" width="640" height="8" fill="#cbd5e1"/>

  <!-- back buildings -->
  <g opacity="0.45">
    <rect x="40" y="270" width="70" height="130" rx="6" fill="#94a3b8"/>
    <rect x="130" y="220" width="60" height="180" rx="6" fill="#94a3b8"/>
    <rect x="470" y="250" width="80" height="150" rx="6" fill="#94a3b8"/>
    <rect x="560" y="290" width="60" height="110" rx="6" fill="#94a3b8"/>
  </g>

  <!-- main buildings -->
  <rect x="200" y="180" width="86" height="220" rx="8" fill="url(#bld)"/>
  <rect x="296" y="130" width="96" height="270" rx="8" fill="url(#bld2)"/>
  <rect x="402" y="210" width="78" height="190" rx="8" fill="url(#bld3)"/>

  <!-- windows -->
  <g fill="#fde68a" opacity="0.95">
    <rect x="214" y="200" width="18" height="22" rx="3"/><rect x="244" y="200" width="18" height="22" rx="3"/>
    <rect x="214" y="238" width="18" height="22" rx="3"/><rect x="244" y="238" width="18" height="22" rx="3"/>
    <rect x="214" y="276" width="18" height="22" rx="3"/><rect x="244" y="276" width="18" height="22" rx="3"/>
    <rect x="214" y="314" width="18" height="22" rx="3"/><rect x="244" y="314" width="18" height="22" rx="3"/>
    <rect x="312" y="152" width="20" height="24" rx="3"/><rect x="344" y="152" width="20" height="24" rx="3"/>
    <rect x="312" y="192" width="20" height="24" rx="3"/><rect x="344" y="192" width="20" height="24" rx="3"/>
    <rect x="312" y="232" width="20" height="24" rx="3"/><rect x="344" y="232" width="20" height="24" rx="3"/>
    <rect x="312" y="272" width="20" height="24" rx="3"/><rect x="344" y="272" width="20" height="24" rx="3"/>
    <rect x="418" y="232" width="18" height="22" rx="3"/><rect x="448" y="232" width="18" height="22" rx="3"/>
    <rect x="418" y="270" width="18" height="22" rx="3"/><rect x="448" y="270" width="18" height="22" rx="3"/>
  </g>

  <!-- Bartlehall-ish pylons with crown? Keep friendly: tower tops -->
  <rect x="236" y="150" width="14" height="34" rx="4" fill="#f59e0b"/>
  <circle cx="243" cy="144" r="8" fill="#f59e0b"/>
  <rect x="336" y="96" width="16" height="38" rx="4" fill="#f59e0b"/>
  <circle cx="344" cy="90" r="9" fill="#f59e0b"/>

  <!-- trees -->
  <g>
    <rect x="96" y="360" width="10" height="42" rx="3" fill="#8b5e34"/>
    <circle cx="101" cy="348" r="26" fill="#16a34a"/>
    <rect x="516" y="356" width="10" height="46" rx="3" fill="#8b5e34"/>
    <circle cx="521" cy="344" r="28" fill="#16a34a"/>
  </g>

  <!-- path -->
  <path d="M270 400 q50 26 100 0" stroke="#cbd5e1" stroke-width="6" fill="none" stroke-linecap="round"/>
</svg>
